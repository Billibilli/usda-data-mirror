name: mirror-usda-data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 5"

permissions:
  contents: write

concurrency:
  group: mirror-usda-data
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate USDA datasets
        env:
          USDA_APP_TOKEN: ${{ secrets.USDA_APP_TOKEN }}
        run: python scripts/fetch_usda.py

      - name: Commit changed snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data meta
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "data: refresh USDA snapshots $(date -u +%F)"
          git push
